<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Villa asset renderer</title></head>
<body style="margin:0">
<canvas style="width:100vw;height:100vh;display:block"></canvas>
<script type="module">
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { makeVilla } from '/src/villa-model.js';
import { loadVilla, mountVilla } from '/src/villa-renderer.js';
import { progressAt } from '/src/build-stages.js';

const canvas = document.querySelector('canvas');
window.exportVilla = async () => {
  const data = await new GLTFExporter().parseAsync(makeVilla(), { binary: true, maxTextureSize: 128 });
  return await new Promise(resolve => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(new Blob([data]));
  });
};
window.captureStage = async index => {
  if (!window.villa) {
    const model = await loadVilla('/villa/mount-lebanon.glb');
    window.villa = mountVilla(canvas, model, { capture: true, pixelRatio: 1 });
  }
  window.villa.setProgress(progressAt(index));
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(resolve))));
  return canvas.toDataURL('image/webp', 0.89).split(',')[1];
};
window.captureShare = async () => {
  await window.captureStage(7);
  const share = document.createElement('canvas');
  share.width = 1200;
  share.height = 630;
  const ctx = share.getContext('2d');
  const gradient = ctx.createRadialGradient(600, 300, 0, 600, 300, 710);
  gradient.addColorStop(0, '#312e29');
  gradient.addColorStop(1, '#111111');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, share.width, share.height);
  ctx.strokeStyle = '#ffffff14';
  for (let x = 18; x < 1200; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 630); ctx.stroke(); }
  for (let y = 18; y < 630; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1200, y); ctx.stroke(); }
  ctx.drawImage(canvas, 45, 0, 1110, 630);
  return share.toDataURL('image/webp', 0.88).split(',')[1];
};
</script>
</body>
</html>
